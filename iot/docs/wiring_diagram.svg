<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="100%" height="100%" style="font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Filter Efek Bayangan -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#0D0E12" rx="12"/>

  <!-- Grid halus latar -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>

  <!-- Header Judul & Metadata -->
  <text x="40" y="42" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="0.5">AKSANTARA TACTILE PAD — SKEMA PERKABELAN DUAL RC522</text>
  <text x="40" y="65" fill="#94A3B8" font-size="13">Mikrokontroler: ESP32-S3 DevKit | Bus: Hardware FSPI (Paralel) + Independent CS/RST | Catu Daya: 3.3V DC</text>

  <!-- ========================================================================= -->
  <!-- MODUL 1: ESP32-S3 DevKit (Tengah Kiri)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <!-- Body ESP32-S3 PCB -->
    <rect width="300" height="490" rx="10" fill="#16181F" stroke="#334155" stroke-width="2"/>
    <rect x="15" y="15" width="270" height="460" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" stroke-opacity="0.5"/>
    
    <!-- Modul Kaleng RF Shielding ESP32-S3 -->
    <rect x="75" y="30" width="150" height="130" rx="4" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <text x="150" y="90" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">ESP32-S3</text>
    <text x="150" y="110" fill="#94A3B8" font-size="11" text-anchor="middle">Dual-Core 240MHz</text>
    <text x="150" y="126" fill="#D4A373" font-size="10" font-weight="600" text-anchor="middle">USB CDC / UART</text>

    <!-- USB Port Representasi -->
    <rect x="110" y="460" width="80" height="25" rx="3" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="150" y="477" fill="#CBD5E1" font-size="10" font-weight="600" text-anchor="middle">USB OTG / CDC</text>

    <!-- Header Pin Kanan ESP32-S3 (Pin yang dipakai) -->
    <!-- Pin 3V3 -->
    <rect x="250" y="180" width="45" height="20" rx="3" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
    <circle cx="285" cy="190" r="4" fill="#EF4444"/>
    <text x="275" y="195" fill="#FCA5A5" font-size="11" font-weight="700" text-anchor="end">3V3</text>

    <!-- Pin GND -->
    <rect x="250" y="210" width="45" height="20" rx="3" fill="#64748B" fill-opacity="0.2" stroke="#64748B" stroke-width="1"/>
    <circle cx="285" cy="220" r="4" fill="#94A3B8"/>
    <text x="275" y="225" fill="#CBD5E1" font-size="11" font-weight="700" text-anchor="end">GND</text>

    <!-- Pin GPIO 12 (SCK) -->
    <rect x="235" y="240" width="60" height="20" rx="3" fill="#0EA5E9" fill-opacity="0.2" stroke="#0EA5E9" stroke-width="1"/>
    <circle cx="285" cy="250" r="4" fill="#0EA5E9"/>
    <text x="275" y="255" fill="#7DD3FC" font-size="11" font-weight="700" text-anchor="end">IO 12 (SCK)</text>

    <!-- Pin GPIO 11 (MOSI) -->
    <rect x="230" y="270" width="65" height="20" rx="3" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <circle cx="285" cy="280" r="4" fill="#10B981"/>
    <text x="275" y="285" fill="#6EE7B7" font-size="11" font-weight="700" text-anchor="end">IO 11 (MOSI)</text>

    <!-- Pin GPIO 13 (MISO) -->
    <rect x="230" y="300" width="65" height="20" rx="3" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="285" cy="310" r="4" fill="#F59E0B"/>
    <text x="275" y="315" fill="#FCD34D" font-size="11" font-weight="700" text-anchor="end">IO 13 (MISO)</text>

    <!-- Pin GPIO 10 (CS 1) -->
    <rect x="225" y="335" width="70" height="20" rx="3" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="285" cy="345" r="4" fill="#8B5CF6"/>
    <text x="275" y="350" fill="#C4B5FD" font-size="11" font-weight="700" text-anchor="end">IO 10 (SS1)</text>

    <!-- Pin GPIO 9 (RST 1) -->
    <rect x="225" y="365" width="70" height="20" rx="3" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-width="1"/>
    <circle cx="285" cy="375" r="4" fill="#EC4899"/>
    <text x="275" y="380" fill="#F472B6" font-size="11" font-weight="700" text-anchor="end">IO 9 (RST1)</text>

    <!-- Pin GPIO 14 (CS 2) -->
    <rect x="225" y="400" width="70" height="20" rx="3" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1"/>
    <circle cx="285" cy="410" r="4" fill="#6366F1"/>
    <text x="275" y="415" fill="#A5B4FC" font-size="11" font-weight="700" text-anchor="end">IO 14 (SS2)</text>

    <!-- Pin GPIO 21 (RST 2) -->
    <rect x="225" y="430" width="70" height="20" rx="3" fill="#F43F5E" fill-opacity="0.2" stroke="#F43F5E" stroke-width="1"/>
    <circle cx="285" cy="440" r="4" fill="#F43F5E"/>
    <text x="275" y="445" fill="#FDA4AF" font-size="11" font-weight="700" text-anchor="end">IO 21 (RST2)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- MODUL 2: RC522 READER 1 (SLOT KONSONAN) - Atas Kanan                      -->
  <!-- ========================================================================= -->
  <g transform="translate(680, 100)" filter="url(#shadow)">
    <!-- Board PCB Biru RC522 -->
    <rect width="250" height="230" rx="8" fill="#0C2556" stroke="#1D4ED8" stroke-width="2"/>
    <!-- Antena PCB Loop -->
    <rect x="15" y="15" width="220" height="60" rx="4" fill="none" stroke="#D4A373" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="125" y="45" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">SLOT 1: KONSONAN</text>
    <text x="125" y="60" fill="#93C5FD" font-size="10" text-anchor="middle">RFID RC522 (13.56 MHz)</text>

    <!-- IC MFRC522 -->
    <rect x="100" y="85" width="50" height="40" rx="2" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <circle cx="110" cy="95" r="2" fill="#94A3B8"/>

    <!-- Pin Header Kiri Reader 1 -->
    <!-- SDA -->
    <circle cx="20" cy="140" r="4" fill="#8B5CF6"/>
    <text x="32" y="144" fill="#C4B5FD" font-size="11" font-weight="700">SDA (SS)</text>
    <!-- SCK -->
    <circle cx="20" cy="158" r="4" fill="#0EA5E9"/>
    <text x="32" y="162" fill="#7DD3FC" font-size="11">SCK</text>
    <!-- MOSI -->
    <circle cx="20" cy="176" r="4" fill="#10B981"/>
    <text x="32" y="180" fill="#6EE7B7" font-size="11">MOSI</text>
    <!-- MISO -->
    <circle cx="20" cy="194" r="4" fill="#F59E0B"/>
    <text x="32" y="198" fill="#FCD34D" font-size="11">MISO</text>
    <!-- IRQ (NC) -->
    <circle cx="20" cy="212" r="3" fill="#64748B" fill-opacity="0.3"/>
    <text x="32" y="215" fill="#64748B" font-size="10">IRQ (NC)</text>

    <!-- GND, RST, 3.3V di sisi kanan/bawah -->
    <circle cx="160" cy="150" r="4" fill="#94A3B8"/>
    <text x="172" y="154" fill="#CBD5E1" font-size="11">GND</text>
    <circle cx="160" cy="175" r="4" fill="#EC4899"/>
    <text x="172" y="179" fill="#F472B6" font-size="11" font-weight="700">RST</text>
    <circle cx="160" cy="200" r="4" fill="#EF4444"/>
    <text x="172" y="204" fill="#FCA5A5" font-size="11" font-weight="700">3.3V</text>
  </g>

  <!-- ========================================================================= -->
  <!-- MODUL 3: RC522 READER 2 (SLOT DIAKRITIK) - Bawah Kanan                    -->
  <!-- ========================================================================= -->
  <g transform="translate(680, 360)" filter="url(#shadow)">
    <!-- Board PCB Biru RC522 -->
    <rect width="250" height="230" rx="8" fill="#0C2556" stroke="#1D4ED8" stroke-width="2"/>
    <!-- Antena PCB Loop -->
    <rect x="15" y="15" width="220" height="60" rx="4" fill="none" stroke="#D4A373" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="125" y="45" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">SLOT 2: DIAKRITIK</text>
    <text x="125" y="60" fill="#93C5FD" font-size="10" text-anchor="middle">RFID RC522 (13.56 MHz)</text>

    <!-- IC MFRC522 -->
    <rect x="100" y="85" width="50" height="40" rx="2" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <circle cx="110" cy="95" r="2" fill="#94A3B8"/>

    <!-- Pin Header Kiri Reader 2 -->
    <!-- SDA -->
    <circle cx="20" cy="140" r="4" fill="#6366F1"/>
    <text x="32" y="144" fill="#A5B4FC" font-size="11" font-weight="700">SDA (SS)</text>
    <!-- SCK -->
    <circle cx="20" cy="158" r="4" fill="#0EA5E9"/>
    <text x="32" y="162" fill="#7DD3FC" font-size="11">SCK</text>
    <!-- MOSI -->
    <circle cx="20" cy="176" r="4" fill="#10B981"/>
    <text x="32" y="180" fill="#6EE7B7" font-size="11">MOSI</text>
    <!-- MISO -->
    <circle cx="20" cy="194" r="4" fill="#F59E0B"/>
    <text x="32" y="198" fill="#FCD34D" font-size="11">MISO</text>
    <!-- IRQ (NC) -->
    <circle cx="20" cy="212" r="3" fill="#64748B" fill-opacity="0.3"/>
    <text x="32" y="215" fill="#64748B" font-size="10">IRQ (NC)</text>

    <!-- GND, RST, 3.3V di sisi kanan/bawah -->
    <circle cx="160" cy="150" r="4" fill="#94A3B8"/>
    <text x="172" y="154" fill="#CBD5E1" font-size="11">GND</text>
    <circle cx="160" cy="175" r="4" fill="#F43F5E"/>
    <text x="172" y="179" fill="#FDA4AF" font-size="11" font-weight="700">RST</text>
    <circle cx="160" cy="200" r="4" fill="#EF4444"/>
    <text x="172" y="204" fill="#FCA5A5" font-size="11" font-weight="700">3.3V</text>
  </g>

  <!-- ========================================================================= -->
  <!-- JALUR PERKABELAN (WIRES) & BUS SPLITTERS                                  -->
  <!-- ========================================================================= -->

  <!-- 1. VCC 3.3V (Merah) -->
  <path d="M 325 290 H 480 V 300 H 840" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 480 300 V 560 H 840" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="480" cy="300" r="4" fill="#EF4444"/>

  <!-- 2. GND (Abu-Abu Gelap) -->
  <path d="M 325 320 H 460 V 250 H 840" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 460 250 V 510 H 840" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="460" cy="250" r="3.5" fill="#94A3B8"/>

  <!-- 3. SCK - GPIO 12 (Biru Langit) -->
  <path d="M 325 350 H 500 V 258 H 700" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  <path d="M 500 258 V 518 H 700" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="500" cy="258" r="3.5" fill="#0EA5E9"/>

  <!-- 4. MOSI - GPIO 11 (Hijau Zamrud) -->
  <path d="M 325 380 H 520 V 276 H 700" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 520 276 V 536 H 700" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="520" cy="276" r="3.5" fill="#10B981"/>

  <!-- 5. MISO - GPIO 13 (Kuning Emas) -->
  <path d="M 325 410 H 540 V 294 H 700" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 540 294 V 554 H 700" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="540" cy="294" r="3.5" fill="#F59E0B"/>

  <!-- 6. SS 1 - GPIO 10 (Ungu) -> Reader 1 SDA -->
  <path d="M 325 445 H 570 V 240 H 700" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 7. RST 1 - GPIO 9 (Pink Magenta) -> Reader 1 RST -->
  <path d="M 325 475 H 590 V 275 H 840" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 8. SS 2 - GPIO 14 (Indigo) -> Reader 2 SDA -->
  <path d="M 325 510 H 610 V 500 H 700" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 9. RST 2 - GPIO 21 (Rose) -> Reader 2 RST -->
  <path d="M 325 540 H 630 V 535 H 840" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ========================================================================= -->
  <!-- KOTAK CATATAN TEGANGAN & PERINGATAN (BAWAH KIRI)                           -->
  <!-- ========================================================================= -->
  <g transform="translate(360, 480)">
    <rect width="250" height="110" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="15" y="24" fill="#A5B4FC" font-size="11" font-weight="700">PETUNJUK DAYA 3.3V:</text>
    <text x="15" y="44" fill="#E2E8F0" font-size="10">• VCC Reader 1 &amp; 2 WAJIB ke 3.3V.</text>
    <text x="15" y="60" fill="#EF4444" font-size="10" font-weight="700">• DILARANG menghubungkan ke 5V!</text>
    <text x="15" y="78" fill="#CBD5E1" font-size="10">• Pasang kapasitor 100nF dekat VCC</text>
    <text x="15" y="94" fill="#CBD5E1" font-size="10">  jika reader sering tidak terbaca.</text>
  </g>
</svg>
