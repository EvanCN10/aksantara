; ============================================================================
; PlatformIO Project Configuration File - Aksantara Tactile Pad
; Target MCU: ESP32-S3-DevKitC-1 (Espressif Systems)
; Framework : Arduino
; Peripherals: Dual MFRC522 RFID 13.56 MHz (SPI)
; Interface  : Web Serial API over USB CDC (115200 Baud)
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor Baud Rate
monitor_speed = 115200

; Kecepatan flashing firmware
upload_speed = 921600

; Build Flags untuk Native USB CDC (Wajib aktif untuk Web Serial API)
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
    -DMFRC522_SPICLOCK=1000000

; Dependensi Pustaka Resmi
lib_deps =
    miguelbalboa/MFRC522 @ 1.4.12

; Filter diagnostik serial monitor
monitor_filters =
    esp32_exception_decoder
    direct
